<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Studio RJ | Dynamic Duration Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.js"></script>
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: #0f172a;
            --bg-input: #1e293b;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.5);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 30px; }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-dim); font-size: 1rem; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1600px;
            margin-bottom: 25px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0% { box-shadow: 0 0 0 0 var(--success-glow); }
            70% { box-shadow: 0 0 0 5px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        .aspect-16-9 {
            aspect-ratio: 16 / 9;
            width: 100%;
            border-radius: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: var(--bg-base); }
        textarea::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #34d399;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            border: none;
            padding: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .preview-box svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .control-deck {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px 30px;
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 20px;
        }

        .settings-group { 
            display: flex; 
            align-items: flex-end; 
            gap: 25px; 
            flex-wrap: wrap;
        }

        .setting-item { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .setting-item label { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: var(--text-dim); 
            text-transform: uppercase; 
        }

        select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border 0.2s;
            min-width: 180px;
        }
        
        select:focus { border-color: var(--accent); }

        /* ── Duration indicator: shows the currently selected seconds live ── */
        .duration-display {
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            user-select: none;
            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: max-content;
            transition: all 0.3s;
        }

        .btn-render {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            flex-shrink: 0;
            align-self: flex-end;
            height: 47px;
        }

        .btn-render:hover { transform: translateY(-2px); box-shadow: 0 12px 25px var(--accent-glow); }
        .btn-render:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .render-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .render-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .render-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .render-subtitle { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 30px; }

        .progress-bar-container {
            width: 100%; height: 12px;
            background: var(--bg-base);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.1s linear;
        }

        /* Live countdown shown inside the overlay */
        .render-timer {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 0.05em;
            margin-top: 10px;
        }

        #downloadArea { margin-top: 25px; text-align: center; }
        
        .download-btn {
            background: var(--success);
            color: #020617;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 8px 25px var(--success-glow);
            transition: all 0.3s;
            display: inline-block;
            text-transform: uppercase;
        }
        .download-btn:hover { background: #34d399; transform: translateY(-2px); }

        @media (max-width: 1000px) {
            .workspace { grid-template-columns: 1fr; }
            .control-deck { flex-direction: column; align-items: stretch; }
            .btn-render { width: 100%; margin-top: 10px; }
            .settings-group { flex-direction: column; align-items: stretch; gap: 15px; }
            .duration-display { width: 100%; }
        }

        #renderCanvas { display: none; }
        #hiddenEngineBox { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SVG Studio - Papir Dol</h1>
        <p class="subtitle">Created by Jubayer Islam | Version 3.0 — Dynamic Duration Fixed</p>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><span>💻</span> Vector Source Code</div>
                <div class="badge-live">LIVE SYNC</div>
            </div>
            <div class="aspect-16-9">
                <textarea id="svgInput" spellcheck="false" placeholder="Paste your <svg> here..."><svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#020617"/>
  <style>
    .neon-path {
      fill: none;
      stroke: #0ea5e9;
      stroke-width: 8;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 6s infinite ease-in-out; 
    }
    .pulse-core {
      fill: #10b981;
      transform-origin: center;
      animation: beat 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes draw {
      0% { stroke-dashoffset: 1000; stroke: #0ea5e9; }
      50% { stroke-dashoffset: 0; stroke: #10b981; }
      100% { stroke-dashoffset: 1000; stroke: #0ea5e9; }
    }
    @keyframes beat {
      0% { transform: scale(0.8) rotate(0deg); }
      50% { transform: scale(1.5) rotate(180deg); }
      100% { transform: scale(0.8) rotate(360deg); }
    }
  </style>
  <g transform="translate(960, 540)">
    <circle class="neon-path" cx="0" cy="0" r="300" />
    <rect class="pulse-core" x="-75" y="-75" width="150" height="150" rx="30" />
  </g>
</svg></textarea>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><span>👁️</span> Cinematic Preview</div>
            </div>
            <div class="aspect-16-9 preview-box" id="previewArea"></div>
        </div>
    </div>

    <div class="control-deck">
        <div class="settings-group">

            <div class="setting-item">
                <label>Resolution Quality</label>
                <select id="videoResolution">
                    <option value="3840x2160">4K Ultra HD (2160p)</option>
                    <option value="2560x1440">2K Quad HD (1440p)</option>
                    <option value="1920x1080" selected>Full HD (1080p)</option>
                </select>
            </div>

            <!-- ✅ FIX 1: Real dropdown for duration instead of a locked label -->
            <div class="setting-item">
                <label>Video Length</label>
                <select id="videoDuration">
                    <option value="3">3 Seconds</option>
                    <option value="5">5 Seconds</option>
                    <option value="6" selected>6 Seconds</option>
                    <option value="8">8 Seconds</option>
                    <option value="10">10 Seconds</option>
                    <option value="15">15 Seconds</option>
                    <option value="20">20 Seconds</option>
                    <option value="30">30 Seconds</option>
                    <option value="60">60 Seconds</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Frame Rate (FPS)</label>
                <select id="videoFps">
                    <option value="60" selected>60 FPS (Smooth)</option>
                    <option value="30">30 FPS (Standard)</option>
                </select>
            </div>

            <!-- Live label showing exactly what was selected -->
            <div class="setting-item">
                <label>Will Record</label>
                <div class="duration-display" id="durationDisplay">⏱ 6 SEC EXACT</div>
            </div>

        </div>

        <button id="convertBtn" class="btn-render">
            ⏺ Convert to Video
        </button>
    </div>
    
    <div id="downloadArea"></div>

    <div class="render-overlay" id="renderOverlay">
        <div class="render-box">
            <div class="render-title" id="renderStatus">Converting VIDEO...</div>
            <div class="render-subtitle">Do not minimize the browser or switch tabs.</div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <!-- ✅ FIX 2: Live countdown so user sees actual time remaining -->
            <div class="render-timer" id="renderTimer">0.0s / 0s</div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>
    <div id="hiddenEngineBox"></div>

    <script>
        const svgInput        = document.getElementById('svgInput');
        const previewArea     = document.getElementById('previewArea');
        const convertBtn      = document.getElementById('convertBtn');
        const downloadArea    = document.getElementById('downloadArea');
        const renderOverlay   = document.getElementById('renderOverlay');
        const renderStatus    = document.getElementById('renderStatus');
        const progressFill    = document.getElementById('progressFill');
        const renderTimer     = document.getElementById('renderTimer');
        const durationDisplay = document.getElementById('durationDisplay');
        const durationSelect  = document.getElementById('videoDuration');

        const canvas = document.getElementById('renderCanvas');
        const hiddenEngineBox = document.getElementById('hiddenEngineBox');
        const ctx = canvas.getContext('2d', { alpha: false });

        // ── Update the "Will Record" badge whenever the dropdown changes ──
        function syncDurationBadge() {
            const secs = parseInt(durationSelect.value);
            durationDisplay.textContent = `⏱ ${secs} SEC EXACT`;
        }
        durationSelect.addEventListener('change', syncDurationBadge);
        syncDurationBadge(); // run once on load

        // ── Live Preview ──
        let typingTimer;
        function updateLivePreview() {
            previewArea.innerHTML = svgInput.value;
            downloadArea.innerHTML = "";
        }
        svgInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(updateLivePreview, 250);
        });
        window.addEventListener('DOMContentLoaded', updateLivePreview);

        // ── Main Render Engine ──
        convertBtn.addEventListener('click', () => {
            let activeSvg = previewArea.querySelector('svg');
            if (!activeSvg) {
                alert("Error: No valid SVG code found.");
                return;
            }

            // ✅ FIX 3: Read duration from the dropdown — NOT a hardcoded constant
            const selectedSeconds   = parseInt(durationSelect.value);
            const EXACT_DURATION_MS = selectedSeconds * 1000; // e.g. 10 → 10000ms

            const fps        = parseInt(document.getElementById('videoFps').value);
            const resSplit   = document.getElementById('videoResolution').value.split('x');
            const targetWidth  = parseInt(resSplit[0]);
            const targetHeight = parseInt(resSplit[1]);

            // Lock UI
            convertBtn.disabled = true;
            renderOverlay.style.display = 'flex';
            progressFill.style.width = '0%';
            renderTimer.textContent = `0.0s / ${selectedSeconds}s`;
            renderStatus.innerText = "UPSCALING VECTORS...";
            downloadArea.innerHTML = "";

            canvas.width  = targetWidth;
            canvas.height = targetHeight;

            // Clone & size the SVG
            let cloneSvg = activeSvg.cloneNode(true);
            if (!cloneSvg.getAttribute('viewBox')) {
                const origW = cloneSvg.getAttribute('width')  || targetWidth;
                const origH = cloneSvg.getAttribute('height') || targetHeight;
                cloneSvg.setAttribute('viewBox', `0 0 ${parseInt(origW)} ${parseInt(origH)}`);
            }
            cloneSvg.setAttribute('width',  targetWidth  + 'px');
            cloneSvg.setAttribute('height', targetHeight + 'px');

            const rawSvgText = new XMLSerializer().serializeToString(cloneSvg);
            const svgBlob    = new Blob([rawSvgText], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl     = URL.createObjectURL(svgBlob);

            const liveImageEl = document.createElement('img');
            liveImageEl.style.width  = targetWidth  + 'px';
            liveImageEl.style.height = targetHeight + 'px';
            hiddenEngineBox.appendChild(liveImageEl);

            liveImageEl.onload = () => {
                renderStatus.innerText = `RECORDING ${selectedSeconds} SECONDS AT ${targetHeight}p...`;

                const stream = canvas.captureStream(fps);
                const recordedChunks = [];

                // Dynamic bitrate
                let targetBitrate = 12000000;
                if (targetWidth >= 2560) targetBitrate = 20000000;
                if (targetWidth >= 3840) targetBitrate = 35000000;

                const mediaOptions = { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: targetBitrate };
                let mediaRecorder;
                try {
                    mediaRecorder = new MediaRecorder(stream, mediaOptions);
                } catch(e) {
                    mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: targetBitrate });
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    renderStatus.innerText = "APPLYING METADATA FIXES...";
                    hiddenEngineBox.innerHTML = '';
                    URL.revokeObjectURL(svgUrl);

                    const brokenBlob = new Blob(recordedChunks, { type: 'video/webm' });

                    // ✅ FIX 4: Pass the user-chosen duration (not a hardcoded 6s/16s) to the metadata fixer
                    ysFixWebmDuration(brokenBlob, EXACT_DURATION_MS, function(fixedBlob) {
                        const videoUrl = URL.createObjectURL(fixedBlob);

                        renderOverlay.style.display = 'none';
                        convertBtn.disabled = false;

                        const filename = `SVG-Studio-${selectedSeconds}sec-${targetHeight}p.webm`;

                        downloadArea.innerHTML = `
                            <a href="${videoUrl}" download="${filename}" class="download-btn">
                                ⬇ Download ${selectedSeconds}-Second Video (${targetHeight}p)
                            </a>
                        `;

                        // Auto-download
                        const a = document.createElement('a');
                        a.href = videoUrl;
                        a.download = filename;
                        a.click();
                    });
                };

                // ✅ FIX 5: The stoppage timer now uses EXACT_DURATION_MS from the dropdown
                mediaRecorder.start();

                const startTime = performance.now();
                let animationId;
                let isRecording = true;

                // Precision stop — fires at exactly the selected milliseconds
                const stopTimeout = setTimeout(() => {
                    isRecording = false;
                    cancelAnimationFrame(animationId);
                    mediaRecorder.stop();
                }, EXACT_DURATION_MS);

                function renderLoop(currentTime) {
                    if (!isRecording) return;

                    const elapsed = currentTime - startTime;

                    // ✅ Progress and countdown both driven by EXACT_DURATION_MS
                    const pct = Math.min((elapsed / EXACT_DURATION_MS) * 100, 100);
                    progressFill.style.width = pct + '%';

                    const elapsedSec   = Math.min(elapsed / 1000, selectedSeconds).toFixed(1);
                    renderTimer.textContent = `${elapsedSec}s / ${selectedSeconds}s`;

                    // Draw frame
                    ctx.fillStyle = '#020617';
                    ctx.fillRect(0, 0, targetWidth, targetHeight);
                    ctx.drawImage(liveImageEl, 0, 0, targetWidth, targetHeight);

                    // Force-dirty pixel so Chrome doesn't drop static frames
                    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
                    ctx.fillRect(0, 0, 1, 1);

                    animationId = requestAnimationFrame(renderLoop);
                }

                requestAnimationFrame(renderLoop);
            };

            liveImageEl.onerror = () => {
                alert("System Error: The SVG code is invalid or missing dependencies.");
                renderOverlay.style.display = 'none';
                convertBtn.disabled = false;
            };

            liveImageEl.src = svgUrl;
        });
    </script>
</body>
</html>
